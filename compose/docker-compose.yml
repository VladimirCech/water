services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: water-app
      POSTGRES_PASSWORD: waterpass
      POSTGRES_DB: waterdb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water-app"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../water_api
      dockerfile: Dockerfile
    env_file:
      - ../water_api/dev.env
    depends_on:
      - db
      - minio
    ports:
      - "8080:8080"
    volumes:
      - ../water_api/app:/app/app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  dbdata:
  minio_data: