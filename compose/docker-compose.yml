version: "3.9"
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: water-app
      POSTGRES_PASSWORD: waterpass
      POSTGRES_DB: waterdb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water-app"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../water_api
      dockerfile: Dockerfile
    env_file:
      - ../water_api/.env
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ../water_api/app:/app/app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  dbdata: