version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build:
      context: ../water_api
      dockerfile: Dockerfile
    env_file:
      - ../water_api/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ../water_api/app:/app/app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  dbdata: